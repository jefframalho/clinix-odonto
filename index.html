<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinix Odonto</title>
<meta name="description" content="Sistema completo para clínicas odontológicas: agenda, pacientes, odontograma, orçamento e financeiro.">
<meta name="theme-color" content="#8AD6F4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: tela de login dividida (marca + formulário); app com barra lateral no computador e navegação inferior no celular */
:root{
  --bg:#F1F8FA; --surface:#FFFFFF; --surface-2:#F5FBFC; --ink:#0F2A33; --muted:#587380; --line:#DAEAEE;
  --accent:#0B86AE; --accent-2:#5CD3AE; --accent-soft:#E0F3F9; --on-accent:#FFFFFF;
  --hero-a:#8AD6F4; --hero-b:#98EBC8; --hero-ink:#0B2A33;
  --ok:#14805A; --ok-soft:#DFF4EA; --warn:#A06300; --warn-soft:#FCEFD8; --bad:#C0394B; --bad-soft:#FBE3E6;
  --info:#2563B0; --info-soft:#E3EDF9; --wa:#1FA45A;
  --shadow:0 8px 28px rgba(15,70,90,.08);
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1518; --surface:#10202A; --surface-2:#152833; --ink:#E6F4F7; --muted:#93AFBA; --line:#223A48;
  --accent:#5CC8EC; --accent-2:#6EE0B8; --accent-soft:#12303D; --on-accent:#04202A;
  --hero-a:#0E5470; --hero-b:#0F6B55; --hero-ink:#E8FBF6;
  --ok:#5ED197; --ok-soft:#173326; --warn:#F0BC5E; --warn-soft:#3A2D14; --bad:#F48A98; --bad-soft:#3B1C22;
  --info:#7EB3EA; --info-soft:#18283A; --wa:#43C97C; --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1518; --surface:#10202A; --surface-2:#152833; --ink:#E6F4F7; --muted:#93AFBA; --line:#223A48;
  --accent:#5CC8EC; --accent-2:#6EE0B8; --accent-soft:#12303D; --on-accent:#04202A;
  --hero-a:#0E5470; --hero-b:#0F6B55; --hero-ink:#E8FBF6;
  --ok:#5ED197; --ok-soft:#173326; --warn:#F0BC5E; --warn-soft:#3A2D14; --bad:#F48A98; --bad-soft:#3B1C22;
  --info:#7EB3EA; --info-soft:#18283A; --wa:#43C97C; --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark; }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font-family:var(--font)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.up:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr;min-height:100vh}
aside.side{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
.inner{max-width:980px;margin:0 auto}
@media (min-width:900px){
  .app{grid-template-columns:250px 1fr}
  aside.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line)}
  nav.bottom{display:none}
  main{padding-block:26px 40px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent)}
.navbtn .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.side .demo{margin-top:auto;font-size:12px;color:var(--muted);padding:12px;background:var(--surface-2);border-radius:12px}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.bottom .row{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px;max-width:600px;margin:0 auto}
nav.bottom button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;cursor:pointer}
nav.bottom svg{width:22px;height:22px}
nav.bottom button.on{color:var(--accent)}

/* Tipografia e blocos */
h1.page{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.2;text-wrap:balance}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
h3{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){ .cols.two{grid-template-columns:1.4fr 1fr} .cols.half{grid-template-columns:1fr 1fr} }
.muted{color:var(--muted)}
.small{font-size:13px}

/* Hero do painel */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(130deg,var(--hero-a) 0%,var(--hero-b) 100%);color:var(--hero-ink);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:14px}
.hero::before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero::after{content:"";position:absolute;width:220px;height:220px;left:30%;bottom:-140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 70%)}
.hero>*{position:relative;z-index:1}
.dra{width:92px;height:92px;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;cursor:pointer;position:relative}
.dra img{width:100%;height:100%;object-fit:cover}
.dra span{font-size:11px;font-weight:700;text-align:center;padding:6px;line-height:1.25}
.dra .cam{color:#fff;position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:8px;background:rgba(0,0,0,.45);display:grid;place-items:center}
.dra .cam svg{width:14px;height:14px}
.hero h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:4px 0 0;opacity:.8;font-size:14px}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hchip{font-size:12px;font-weight:700;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.45);padding:5px 10px;border-radius:99px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:760px){ .kpis{grid-template-columns:repeat(4,1fr)} }
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.kpi .ic svg{width:19px;height:19px}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.t-acc{background:var(--accent-soft);color:var(--accent)} .t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)}

/* Gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent-2)} .chart .bar.cur{fill:var(--accent)}
.chart .grid{stroke:var(--line)} .chart text{fill:var(--muted);font:600 12px var(--font)} .chart text.v{fill:var(--ink);font-weight:800}

/* Listas */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.li.click{cursor:pointer} .li.click:hover{border-color:var(--accent)}
.li .who{min-width:0}
.li strong{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .end{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.li .acts .pill{margin-right:auto}
.av{width:46px;height:46px;border-radius:15px;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:88px;height:88px;border-radius:26px;font-size:28px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.empty{color:var(--muted);text-align:center;padding:26px 14px;border:1.5px dashed var(--line);border-radius:18px;font-size:14px}

/* Botões e campos */
.btn{font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.block{width:100%;padding:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{font-weight:500;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:12px}
.hide{display:none!important}

/* Agenda */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:12px;scrollbar-width:none}
.day{flex:0 0 auto;min-width:62px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:8px 10px;text-align:center;cursor:pointer}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.day b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.day.on{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));border-color:transparent;color:var(--hero-ink)}
.day.on small{color:var(--hero-ink);opacity:.8}
.slot{display:grid;grid-template-columns:54px 1fr;gap:10px}
.slot .hr{font-weight:800;font-variant-numeric:tabular-nums;padding-top:14px;color:var(--accent)}

/* Ficha */
.fhead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.upav{position:relative;cursor:pointer}
.upav .cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:3px solid var(--surface)}
.upav .cam svg{width:15px;height:15px}
.alerts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;gap:4px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin:14px 0;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:9px 12px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);cursor:pointer;font-weight:600;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--bad);flex:none}
.check.on{border-color:var(--bad);background:var(--bad-soft)}

/* Odontograma */
.odwrap{overflow-x:auto;padding-bottom:4px}
.odonto{display:flex;flex-direction:column;gap:6px;min-width:560px}
.arc{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.arc .mid{border-left:2px dashed var(--line)}
.tooth{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;padding:0;color:var(--ink)}
.tooth svg{width:100%;max-width:34px;height:auto}
.tooth svg path{stroke:var(--muted);stroke-width:1.4}
.tooth small{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tooth.x svg{opacity:.35}
.arcsep{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.legend button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-weight:600;font-size:12px;cursor:pointer;color:var(--ink)}
.legend button i{width:12px;height:12px;border-radius:4px;border:1px solid var(--muted)}
.legend button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* Fotos */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff}
.ph .del{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:8px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:15px}
.ph .dt{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
label.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1;border:1.5px dashed var(--accent);border-radius:16px;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;background:var(--accent-soft);text-align:center;padding:8px}
label.up svg{width:28px;height:28px}
label.up input{position:absolute;width:1px;height:1px;opacity:0}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

/* Orçamento / financeiro */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tn{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;padding:2px 8px;border-radius:8px}
.xbtn{border:0;background:var(--bad-soft);color:var(--bad);width:28px;height:28px;border-radius:9px;font-size:16px;cursor:pointer}
.grad{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border:0}
.grad .big{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.pays{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.pay{background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.45);border-radius:14px;padding:8px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.pay span{display:block;font-size:11px;font-weight:600;opacity:.8}
.pay.best{background:var(--hero-ink);color:var(--hero-a)}
pre.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:14px;padding:14px;font:500 13px/1.6 var(--font);margin:10px 0 12px;border:1px solid var(--line)}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.tile .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:15px} .tile small{color:var(--muted);font-size:12px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--accent),var(--hero-b));color:#fff;box-shadow:0 12px 28px rgba(11,134,174,.35);cursor:pointer;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:900px){ .fab{bottom:28px} }
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:90vw}
.foot{color:var(--muted);font-size:12px;margin-top:24px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;padding:0}
@media (prefers-reduced-motion: no-preference){

function toFS(col,d){if(col==="meta"&&Array.isArray(d.list))d.list=d.list.map(p=>Array.isArray(p)?{n:p[0],v:p[1]}:p);return d}
function fromFS(col,d){if(col==="meta"&&Array.isArray(d.list))d.list=d.list.map(p=>Array.isArray(p)?p:[p.n,p.v]);return d}

function clinicActive(c){if(!c)return false;if(c.status==="bloqueado")return false;return dayDiff(toD(c.vencimento))>=-CFG.carencia}
function situacao(c){const d=dayDiff(toD(c.vencimento));
 if(c.status==="bloqueado")return{k:"bloq",t:"Bloqueada",cls:"t-bad",d};
 if(d<-CFG.carencia)return{k:"bloq",t:"Bloqueada (atraso)",cls:"t-bad",d};
 if(d<0)return{k:"atraso",t:`Atrasada ${-d}d`,cls:"t-bad",d};
 if(c.status==="teste")return{k:"teste",t:`Teste · ${d}d`,cls:"t-info",d};
 if(d<=5)return{k:"vence",t:`Vence em ${d}d`,cls:"t-warn",d};
 return{k:"ok",t:"Em dia",cls:"t-ok",d}}

function barChart(months,label){const max=Math.max(...months.map(m=>m.v),1000),top=Math.ceil(max/(max>20000?10000:2000))*(max>20000?10000:2000);const W=600,H=230,pl=48,pb=28,pt=24,bw=(W-pl-20)/months.length;const y=v=>pt+(H-pt-pb)*(1-v/top);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;for(let g=0;g<=top;g+=top/4)s+=`<line class="grid" x1="${pl}" x2="${W-10}" y1="${y(g)}" y2="${y(g)}"/><text x="${pl-8}" y="${y(g)+4}" text-anchor="end">${g>=1000?(g/1000)+"k":g}</text>`;
 months.forEach((m,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6,last=i===months.length-1;s+=`<rect class="bar ${last?"cur":""}" x="${x}" y="${y(m.v)}" width="${w}" height="${Math.max(0,y(0)-y(m.v))}" rx="8"/>${m.v?`<text class="v" x="${x+w/2}" y="${y(m.v)-7}" text-anchor="middle">${m.v>=1000?(m.v/1000).toFixed(1).replace(".",",")+"k":Math.round(m.v)}</text>`:""}<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${m.l}</text>`});return s+"</svg>"}

function vFinanceiro(){if(!DONO())return vHome();const mes=TODAY.getMonth(),ano=TODAY.getFullYear();const inMes=f=>parse(f.venc).getMonth()===mes&&parse(f.venc).getFullYear()===ano;
 const rec=S.fin.filter(f=>f.pago&&inMes(f)).reduce((s,f)=>s+f.valor,0),prev=S.fin.filter(f=>!f.pago&&diff(f.venc)>=0).reduce((s,f)=>s+f.valor,0),atr=S.fin.filter(f=>!f.pago&&diff(f.venc)<0).reduce((s,f)=>s+f.valor,0),lab=S.lab.reduce((s,l)=>s+(+l.valor||0),0);
 const formas={};S.fin.filter(f=>f.pago&&inMes(f)).forEach(f=>formas[f.forma]=(formas[f.forma]||0)+f.valor);

 its.sort((a,b)=>(a.pago-b.pago)||(a.pago?b.venc.localeCompare(a.venc):a.venc.localeCompare(b.venc)));
 return `<div class="pagehead"><div><h1 class="page">Financeiro</h1><p class="sub">${TODAY.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})}</p></div><button class="btn pri" data-act="newFin">+ Lançamento</button></div>
 <div class="kpis"><div class="kpi"><div class="ic t-ok">${ic("check")}</div><b>${brl(rec)}</b><span>Recebido no mês</span></div><div class="kpi"><div class="ic t-info">${ic("cal")}</div><b>${brl(prev)}</b><span>A receber</span></div><div class="kpi"><div class="ic t-bad">${ic("alert")}</div><b>${brl(atr)}</b><span>Atrasado</span></div><div class="kpi"><div class="ic t-warn">${ic("lab")}</div><b>${brl(lab)}</b><span>Custos com laboratório</span></div></div>

  <div class="card" style="align-self:start"><h3 style="margin-bottom:12px">Como os pacientes pagam</h3><div class="stack" style="gap:10px">${Object.entries(formas).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><div class="row" style="justify-content:space-between"><span class="small" style="font-weight:600">${k}</span><span class="small" style="font-weight:800">${Math.round(v/rec*100)}% · ${brl(v)}</span></div><div class="progress"><i style="width:${v/rec*100}%;background:var(--accent)"></i></div></div>`).join("")||`<p class="small muted">Sem recebimentos neste mês.</p>`}</div></div></div>`}

function vOrc(){if(!S.pac.length)return `<div class="pagehead"><h1 class="page">Orçamento</h1></div><div class="empty">Cadastre um paciente antes de fazer orçamentos.</div>`;

/* ---------- render ---------- */
const VIEWS={home:vHome,agenda:vAgenda,pacientes:vPacientes,ficha:vFicha,financeiro:vFinanceiro,orcamento:vOrc,retornos:vRetornos,lab:vLab,mais:vMais,config:vConfig};
function render(){const R=$("root");
 if(U===undefined){R.innerHTML=`<div class="boot">Carregando ${esc(CFG.produto)}…</div>`;return}
 if(!U){R.innerHTML=vAuth();bindAuth();return}
 if(U.admin){R.innerHTML=vAdmin();bindAdmin();return}
 if(!U.cid){R.innerHTML=`<div class="lockscreen"><div class="card"><div class="bigic t-warn">${ic("alert")}</div><h1 class="page">Conta sem clínica</h1><p class="sub">Este e-mail não está ligado a nenhuma clínica. Fale com o suporte${CFG.suporteWhatsApp?": "+esc(CFG.suporteWhatsApp):""}.</p><button class="btn mt" data-act="logout">Sair</button></div></div>`;return}
 if(!C||!READY){R.innerHTML=`<div class="boot">Abrindo a clínica…</div>`;return}
 if(!clinicActive(C)){R.innerHTML=vBlocked();return}
 if(!VIEWS[route.v])route={v:"home"};R.innerHTML=shell(VIEWS[route.v]());bindView()}

function bindAuth(){const f=$("authForm");if(!f)return;f.onsubmit=async e=>{e.preventDefault();authErr="";const b=f.querySelector("button[type=submit]");b.disabled=true;b.textContent="Aguarde…";
 try{if(authMode==="entrar")await BE.login($("aEmail").value,$("aSenha").value);
  else if(authMode==="criar")await BE.signup({clinica:$("aClin").value.trim(),dentista:$("aDent").value.trim(),fone:$("aFone").value.trim(),cidade:$("aCid").value.trim(),email:$("aEmail").value.trim().toLowerCase(),senha:$("aSenha").value});
  else{await BE.reset($("aEmail").value);authMode="entrar";toast("Enviamos o link para o seu e-mail");render()}}
 catch(err){authErr=errMsg(err);render()}}}
function bindAdmin(){const q=$("admQ");if(q)q.oninput=e=>{admQ=e.target.value;const pos=e.target.selectionStart;render();const n=$("admQ");n.focus();n.setSelectionRange(pos,pos)};
 document.querySelectorAll("[data-aform]").forEach(f=>f.onsubmit=e=>{e.preventDefault();const fd=new FormData(f);admEdit=null;BE.adminUpdate(f.dataset.aform,{valor:+fd.get("valor")||0,vencimento:parse(fd.get("venc")),status:fd.get("status")});toast("Clínica atualizada")})}
function bindView(){
 const af=$("agForm");if(af){$("agPac").onchange=e=>{const n=e.target.value==="new";$("agNovoL").classList.toggle("hide",!n);$("agFoneL").classList.toggle("hide",!n)};if(!S.pac.length){$("agPac").value="new";$("agPac").onchange({target:$("agPac")})}
  af.onsubmit=e=>{e.preventDefault();let pid=$("agPac").value;if(pid==="new"){const nome=$("agNovo").value.trim();if(!nome){toast("Informe o nome");return}pid=newPac(nome,$("agFone").value.trim()).id}
  S.ag.push({id:uid(),pid,data:$("agData").value,hora:$("agHora").value,proc:$("agProc").value,st:"wait"});dia=$("agData").value;save();go("agenda");toast("Consulta agendada")};
  if(route.arg&&route.v==="agenda"){af.classList.remove("hide");$("agPac").value=route.arg}}
 const pf=$("pacForm");if(pf)pf.onsubmit=e=>{e.preventDefault();const p=newPac($("npNome").value.trim(),$("npFone").value.trim(),$("npNasc").value);save();fichaTab="dados";go("ficha",p.id);toast("Paciente cadastrado")};
 const bs=$("busca");if(bs)bs.oninput=e=>{busca=e.target.value;const pos=e.target.selectionStart;render();const n=$("busca");n.focus();n.setSelectionRange(pos,pos)};
 const ff=$("finForm");if(ff)ff.onsubmit=e=>{e.preventDefault();if(!$("fPac").value){toast("Cadastre um paciente primeiro");return}S.fin.push({id:uid(),pid:$("fPac").value,desc:$("fDesc").value,valor:+$("fVal").value||0,forma:$("fForma").value,venc:$("fVenc").value,pago:$("fPago").value==="1"});save();render();toast("Lançamento salvo")};
 const lf=$("labForm");if(lf)lf.onsubmit=e=>{e.preventDefault();if(!$("lPac").value){toast("Cadastre um paciente primeiro");return}S.lab.push({id:uid(),pid:$("lPac").value,trab:$("lTrab").value,dente:$("lDente").value,labn:$("lLab").value,envio:T,prazo:$("lPrazo").value,st:0,valor:+$("lVal").value||0});save();render();toast("Envio registrado")};
 const rf=$("retForm");if(rf)rf.onsubmit=e=>{e.preventDefault();if(!$("rPac").value){toast("Cadastre um paciente primeiro");return}S.ret.push({id:uid(),pid:$("rPac").value,tipo:$("rTipo").value,ult:$("rUlt").value,dias:+$("rDias").value});save();render();toast("Retorno salvo")};
 const sf=$("staffForm");if(sf)sf.onsubmit=async e=>{e.preventDefault();const b=sf.querySelector("button");b.disabled=true;try{await BE.addStaff(C.id,$("sNome").value.trim(),$("sEmail").value.trim().toLowerCase(),$("sSenha").value);toast("Acesso criado. Passe o e-mail e a senha para a pessoa.");sf.reset()}catch(err){toast(errMsg(err))}b.disabled=false};
 if(route.v==="orcamento"&&$("oProc")){$("oProc").onchange=e=>$("oVal").value=PR()[e.target.value][1];$("oPac").onchange=e=>{ORC().pid=e.target.value;save();render()};$("oDesc").onchange=e=>{ORC().desc=Math.min(30,Math.max(0,+e.target.value||0));save();render()};$("oNp").onchange=e=>{ORC().np=+e.target.value;save();render()}}
 if(route.v==="config"&&cfgTab==="equipe")BE.watchTeam(C.id,t=>{const ch=stable(t)!==stable(TEAM);TEAM=t;if(ch)scheduleRender()});
}

/* ---------- eventos ---------- */
let cfT;
document.addEventListener("input",e=>{const t=e.target;
 if(t.dataset.pf){const p=P(route.arg);if(p){p[t.dataset.pf]=t.value;saveSoon()}}

 if(t.dataset.proc!==undefined){const m=meta("procs");if(!m.list)m.list=DEF_PROCS.map(x=>x.slice());const r=m.list[+t.dataset.proc];if(t.dataset.k==="1")r[1]=+t.value||0;else r[0]=t.value;saveSoon()}});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.dataset.anam){const p=P(route.arg);if(t.checked)p.anam[t.dataset.anam]=1;else delete p.anam[t.dataset.anam];save();render()}
 if(t.dataset.pf==="nome"||t.dataset.pf==="nasc")render();
 if(t.dataset.up&&t.files&&t.files.length){try{

 }catch(err){console.error(err);toast("Não consegui salvar essa imagem")}}});
document.addEventListener("click",async e=>{
 const b=e.target.closest("[data-go],[data-ficha],[data-act],[data-dia],[data-ast],[data-adel],[data-ftab],[data-ctab],[data-tooth],[data-tool],[data-phdel],[data-pay],[data-finf],[data-orm],[data-approve],[data-labst],[data-retok],[data-auth],[data-demo],[data-copy],[data-pdel],[data-staffdel],[data-admf],[data-apay],[data-ablock],[data-aedit]");if(!b)return;const d=b.dataset;

 if(d.demo){try{await BE.login(d.demo,"123456")}catch(err){authErr=errMsg(err);render()}return}
 if(d.copy){const el=$(d.copy);navigator.clipboard.writeText(el.textContent).then(()=>toast("Copiado")).catch(()=>{const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("Texto selecionado, copie com Ctrl+C")});return}
 if(d.admf){admF=d.admf;render();return}
 if(d.aedit!==undefined){admEdit=d.aedit||null;render();return}
 if(d.apay){const c=ADM.find(x=>x.id===d.apay);const base=new Date(Math.max(toD(c.vencimento),TODAY));await BE.adminUpdate(c.id,{status:"ativo",vencimento:addMonths(base,1),pagamentos:[...(c.pagamentos||[]),{data:T,valor:+c.valor||0}]});toast("Pagamento registrado: vence em "+addMonths(base,1).toLocaleDateString("pt-BR"));return}
 if(d.ablock){await BE.adminUpdate(d.ablock,{status:d.v});toast(d.v==="bloqueado"?"Clínica bloqueada":"Clínica desbloqueada");return}
 if(d.go){go(d.go);return}
 if(d.ficha){fichaTab="dados";go("ficha",d.ficha);return}
 if(d.dia){dia=d.dia;render();return}
 if(d.ast){const a=S.ag.find(x=>x.id==d.id);a.st=d.ast;if(a.st==="done"){const p=P(a.pid);if(p)p.hist.push({data:a.data,proc:a.proc,dente:"",obs:""})}save();render();toast({ok:"Consulta confirmada",bad:"Horário livre para encaixe",done:"Atendimento registrado no histórico"}[a.st]);return}
 if(d.adel){S.ag=S.ag.filter(x=>x.id!=d.adel);save();render();toast("Vaga liberada");return}
 if(d.ftab){fichaTab=d.ftab;render();return}
 if(d.ctab){cfgTab=d.ctab;render();return}
 if(d.tool!==undefined){odTool=d.tool;render();return}
 if(d.tooth){const p=P(route.arg),n=d.tooth;if(odTool===""||p.dentes[n]===odTool)delete p.dentes[n];else p.dentes[n]=odTool;save();render();return}
 if(d.phdel){S.fotos=S.fotos.filter(f=>f.id!==d.phdel);save();render();return}
 if(d.pay){const f=S.fin.find(x=>x.id==d.pay);f.pago=true;if(f.venc>T)f.venc=T;save();render();toast("Pagamento recebido");return}
 if(d.finf){finF=d.finf;render();return}

 if(d.staffdel){await BE.removeStaff(d.staffdel);toast("Acesso removido");return}
 if(d.retok){const r=S.ret.find(x=>x.id===d.retok);r.ult=T;save();render();toast("Retorno renovado");return}
 if(d.approve){const o=ORC(),tot=o.items.reduce((s,i)=>s+i.v,0);if(!tot){toast("Adicione procedimentos");return}
  if(d.approve==="vista")S.fin.push({id:uid(),pid:o.pid,desc:"Plano de tratamento (à vista)",valor:Math.round(tot*(1-o.desc/100)*100)/100,forma:"Pix",venc:T,pago:false});

 if(d.labst){const l=S.lab.find(x=>x.id==d.labst);l.st=Math.min(2,l.st+1);if(l.st===2){const p=P(l.pid);if(p)p.hist.push({data:T,proc:"Instalação: "+l.trab,dente:l.dente,obs:l.labn})}save();render();toast(l.st===1?"Marcado como pronto":"Instalação registrada no histórico");return}
 const A=d.act;

 if(A==="addProc"){const m=meta("procs");if(!m.list)m.list=DEF_PROCS.map(x=>x.slice());m.list.push(["Novo procedimento",100]);save();render()}
