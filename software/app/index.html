<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinix Odonto</title>
<meta name="description" content="Sistema completo para clínicas odontológicas: agenda, pacientes, odontograma, orçamento e financeiro.">
<meta name="theme-color" content="#8AD6F4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}
/* Layout: tela de login dividida (marca + formulário); app com barra lateral no computador e navegação inferior no celular */
:root{
  --bg:#F1F8FA; --surface:#FFFFFF; --surface-2:#F5FBFC; --ink:#0F2A33; --muted:#587380; --line:#DAEAEE;
  --accent:#0B86AE; --accent-2:#5CD3AE; --accent-soft:#E0F3F9; --on-accent:#FFFFFF;
  --hero-a:#8AD6F4; --hero-b:#98EBC8; --hero-ink:#0B2A33;
  --ok:#14805A; --ok-soft:#DFF4EA; --warn:#A06300; --warn-soft:#FCEFD8; --bad:#C0394B; --bad-soft:#FBE3E6;
  --info:#2563B0; --info-soft:#E3EDF9; --wa:#1FA45A;
  --shadow:0 8px 28px rgba(15,70,90,.08);
  --font:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1518; --surface:#10202A; --surface-2:#152833; --ink:#E6F4F7; --muted:#93AFBA; --line:#223A48;
  --accent:#5CC8EC; --accent-2:#6EE0B8; --accent-soft:#12303D; --on-accent:#04202A;
  --hero-a:#0E5470; --hero-b:#0F6B55; --hero-ink:#E8FBF6;
  --ok:#5ED197; --ok-soft:#173326; --warn:#F0BC5E; --warn-soft:#3A2D14; --bad:#F48A98; --bad-soft:#3B1C22;
  --info:#7EB3EA; --info-soft:#18283A; --wa:#43C97C; --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0A1518; --surface:#10202A; --surface-2:#152833; --ink:#E6F4F7; --muted:#93AFBA; --line:#223A48;
  --accent:#5CC8EC; --accent-2:#6EE0B8; --accent-soft:#12303D; --on-accent:#04202A;
  --hero-a:#0E5470; --hero-b:#0F6B55; --hero-ink:#E8FBF6;
  --ok:#5ED197; --ok-soft:#173326; --warn:#F0BC5E; --warn-soft:#3A2D14; --bad:#F48A98; --bad-soft:#3B1C22;
  --info:#7EB3EA; --info-soft:#18283A; --wa:#43C97C; --shadow:0 8px 28px rgba(0,0,0,.4); color-scheme:dark; }

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font-family:var(--font)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,label.up:focus-within{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr;min-height:100vh}
aside.side{display:none}
main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(100px + env(safe-area-inset-bottom,0px))}
.inner{max-width:980px;margin:0 auto}
@media (min-width:900px){
  .app{grid-template-columns:250px 1fr}
  aside.side{display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;padding:22px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-right:1px solid var(--line)}
  nav.bottom{display:none}
  main{padding-block:26px 40px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}
}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.mark{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
.brand b{display:block;font-weight:800;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;font-size:12px;color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--surface-2);color:var(--ink)}
.navbtn.on{background:var(--accent-soft);color:var(--accent)}
.navbtn .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px}
.side .demo{margin-top:auto;font-size:12px;color:var(--muted);padding:12px;background:var(--surface-2);border-radius:12px}

nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
nav.bottom .row{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding-block:6px;max-width:600px;margin:0 auto}
nav.bottom button{border:0;background:transparent;color:var(--muted);font-weight:700;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;cursor:pointer}
nav.bottom svg{width:22px;height:22px}
nav.bottom button.on{color:var(--accent)}

/* Tipografia e blocos */
h1.page{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.2;text-wrap:balance}
.pagehead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
h3{font-size:16px;font-weight:800;margin:0;letter-spacing:-.01em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:var(--shadow);min-width:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){ .cols.two{grid-template-columns:1.4fr 1fr} .cols.half{grid-template-columns:1fr 1fr} }
.muted{color:var(--muted)}
.small{font-size:13px}

/* Hero do painel */
.hero{position:relative;overflow:hidden;border-radius:28px;background:linear-gradient(130deg,var(--hero-a) 0%,var(--hero-b) 100%);color:var(--hero-ink);padding:22px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-bottom:14px}
.hero::before{content:"";position:absolute;width:340px;height:340px;right:-120px;top:-150px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero::after{content:"";position:absolute;width:220px;height:220px;left:30%;bottom:-140px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.45),transparent 70%)}
.hero>*{position:relative;z-index:1}
.dra{width:92px;height:92px;border-radius:28px;overflow:hidden;background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.6);display:grid;place-items:center;cursor:pointer;position:relative}
.dra img{width:100%;height:100%;object-fit:cover}
.dra span{font-size:11px;font-weight:700;text-align:center;padding:6px;line-height:1.25}
.dra .cam{color:#fff;position:absolute;right:4px;bottom:4px;width:24px;height:24px;border-radius:8px;background:rgba(0,0,0,.45);display:grid;place-items:center}
.dra .cam svg{width:14px;height:14px}
.hero h1{font-size:26px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.15}
.hero p{margin:4px 0 0;opacity:.8;font-size:14px}
.hero .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.hchip{font-size:12px;font-weight:700;background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.45);padding:5px 10px;border-radius:99px}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media (min-width:760px){ .kpis{grid-template-columns:repeat(4,1fr)} }
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center}
.kpi .ic svg{width:19px;height:19px}
.kpi b{font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}
.t-acc{background:var(--accent-soft);color:var(--accent)} .t-ok{background:var(--ok-soft);color:var(--ok)} .t-warn{background:var(--warn-soft);color:var(--warn)} .t-bad{background:var(--bad-soft);color:var(--bad)} .t-info{background:var(--info-soft);color:var(--info)}

/* Gráfico */
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent-2)} .chart .bar.cur{fill:var(--accent)}
.chart .grid{stroke:var(--line)} .chart text{fill:var(--muted);font:600 12px var(--font)} .chart text.v{fill:var(--ink);font-weight:800}

/* Listas */
.list{display:flex;flex-direction:column;gap:8px}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line);min-width:0}
.li.click{cursor:pointer} .li.click:hover{border-color:var(--accent)}
.li .who{min-width:0}
.li strong{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .end{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.li .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.li .acts .pill{margin-right:auto}
.av{width:46px;height:46px;border-radius:15px;overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.av.lg{width:88px;height:88px;border-radius:26px;font-size:28px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.empty{color:var(--muted);text-align:center;padding:26px 14px;border:1.5px dashed var(--line);border-radius:18px;font-size:14px}

/* Botões e campos */
.btn{font-weight:700;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,border-color .12s;white-space:nowrap}
.btn:hover{border-color:var(--accent)} .btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn.block{width:100%;padding:12px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
input,select,textarea{font-weight:500;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-weight:600;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mt{margin-top:12px}
.hide{display:none!important}

/* Agenda */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:12px;scrollbar-width:none}
.day{flex:0 0 auto;min-width:62px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:18px;padding:8px 10px;text-align:center;cursor:pointer}
.day small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.day b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.day.on{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));border-color:transparent;color:var(--hero-ink)}
.day.on small{color:var(--hero-ink);opacity:.8}
.slot{display:grid;grid-template-columns:54px 1fr;gap:10px}
.slot .hr{font-weight:800;font-variant-numeric:tabular-nums;padding-top:14px;color:var(--accent)}

/* Ficha */
.fhead{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.upav{position:relative;cursor:pointer}
.upav .cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;border:3px solid var(--surface)}
.upav .cam svg{width:15px;height:15px}
.alerts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin:14px 0;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:9px 12px;border-radius:12px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--accent);color:var(--on-accent)}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);cursor:pointer;font-weight:600;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--bad);flex:none}
.check.on{border-color:var(--bad);background:var(--bad-soft)}

/* Odontograma */
.odwrap{overflow-x:auto;padding-bottom:4px}
.odonto{display:flex;flex-direction:column;gap:6px;min-width:560px}
.arc{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}
.arc .mid{border-left:2px dashed var(--line)}
.tooth{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;padding:0;color:var(--ink)}
.tooth svg{width:100%;max-width:34px;height:auto}
.tooth svg path{stroke:var(--muted);stroke-width:1.4}
.tooth small{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.tooth.x svg{opacity:.35}
.arcsep{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;border-top:1px solid var(--line);padding-top:4px}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.legend button{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 10px;font-weight:600;font-size:12px;cursor:pointer;color:var(--ink)}
.legend button i{width:12px;height:12px;border-radius:4px;border:1px solid var(--muted)}
.legend button.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}

/* Fotos */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ph{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff}
.ph .del{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:8px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:15px}
.ph .dt{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.6))}
label.up{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1;border:1.5px dashed var(--accent);border-radius:16px;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;background:var(--accent-soft);text-align:center;padding:8px}
label.up svg{width:28px;height:28px}
label.up input{position:absolute;width:1px;height:1px;opacity:0}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}

/* Orçamento / financeiro */
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tn{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;padding:2px 8px;border-radius:8px}
.xbtn{border:0;background:var(--bad-soft);color:var(--bad);width:28px;height:28px;border-radius:9px;font-size:16px;cursor:pointer}
.grad{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border:0}
.grad .big{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.pays{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.pay{background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.45);border-radius:14px;padding:8px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.pay span{display:block;font-size:11px;font-weight:600;opacity:.8}
.pay.best{background:var(--hero-ink);color:var(--hero-a)}
pre.msg{white-space:pre-wrap;background:var(--surface-2);border-radius:14px;padding:14px;font:500 13px/1.6 var(--font);margin:10px 0 12px;border:1px solid var(--line)}
.progress{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.progress i{display:block;height:100%;border-radius:99px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:16px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.tile .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:15px} .tile small{color:var(--muted);font-size:12px}
.steps{display:flex;gap:4px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.steps i.on{background:var(--accent)}

.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:21;width:58px;height:58px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--accent),var(--hero-b));color:#fff;box-shadow:0 12px 28px rgba(11,134,174,.35);cursor:pointer;display:grid;place-items:center}
.fab svg{width:26px;height:26px}
@media (min-width:900px){ .fab{bottom:28px} }
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:40;max-width:90vw}
.foot{color:var(--muted);font-size:12px;margin-top:24px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:12px;cursor:pointer;padding:0}
@media (prefers-reduced-motion: no-preference){

function termosHTML(){const P=esc(CFG.produto);return `
<h3>1. Sobre o ${P}</h3><p>O ${P} é um sistema online para gestão de clínicas e consultórios odontológicos, fornecido por ${esc(CFG.vendedor)} ("nós"). Contato: ${contatoHTML()}.</p>
<h3>2. Quem pode usar</h3><p>O sistema é destinado a profissionais e clínicas de odontologia ("Clínica"). Quem cria a conta declara ter poderes para representar a Clínica e é o responsável pela conta. A Clínica pode dar acesso à sua equipe e responde pelo uso feito por ela.</p>
<h3>3. Acesso e senha</h3><p>O acesso é feito com e-mail e senha, que são pessoais. A Clínica deve manter a senha em sigilo, remover o acesso de quem deixar a equipe e nos avisar se suspeitar de uso indevido.</p>
<h3>4. Teste grátis, mensalidade e bloqueio</h3><p>Novas clínicas têm um período de teste grátis. Depois dele, o uso depende do pagamento da mensalidade informada no sistema, por Pix. Com ${CFG.carencia} dias de atraso, o acesso é suspenso até o pagamento. A suspensão não apaga os dados da Clínica. O valor pode ser reajustado com aviso prévio de 30 dias.</p>
<h3>5. Responsabilidades da Clínica</h3><p>A Clínica é a <b>controladora</b> dos dados dos seus pacientes, nos termos da Lei Geral de Proteção de Dados (Lei nº 13.709/2018, LGPD). Cabe a ela: ter base legal para cadastrar e tratar os dados; informar seus pacientes sobre esse tratamento; responder aos pedidos dos pacientes; revisar o conteúdo dos contratos e termos que usar; e cumprir os prazos legais de guarda do prontuário e as normas do Conselho Federal de Odontologia.</p>
<h3>6. Nossas responsabilidades</h3><p>Atuamos como <b>operador</b> dos dados dos pacientes: tratamos esses dados apenas para fazer o sistema funcionar e conforme as instruções da Clínica. Adotamos medidas de segurança razoáveis, descritas na Política de Privacidade. Trabalhamos para manter o sistema disponível, mas podem ocorrer interrupções por manutenção, falhas de internet ou de fornecedores.</p>
<h3>7. Cancelamento e exclusão</h3><p>A Clínica pode cancelar quando quiser, sem multa. Antes de cancelar, pode exportar seus dados em Configurações › Privacidade. Após o pedido de exclusão, os dados são apagados em até 90 dias, exceto quando a lei exigir que sejam mantidos.</p>
<h3>8. Limitação de responsabilidade</h3><p>Não respondemos por decisões clínicas, pelo conteúdo inserido pela Clínica, por mensagens enviadas pela Clínica aos pacientes nem por prejuízos causados por uso indevido da senha. Nossa responsabilidade, quando existir, fica limitada ao valor pago nos últimos 12 meses.</p>
<h3>9. Mudanças nestes termos</h3><p>Podemos atualizar estes termos. Quando houver mudança relevante, a Clínica será avisada no sistema e precisará aceitar a nova versão para continuar.</p>
<h3>10. Foro</h3><p>Fica eleito o foro da comarca de Mauriti, CE, salvo regra legal diferente.</p>`}

<h3>3. Para que usamos e com qual base legal</h3><p>Prestar o serviço contratado pela Clínica (execução de contrato, art. 7º, V, da LGPD). Cobrar a mensalidade. Os dados de saúde dos pacientes são tratados pela Clínica para a tutela da saúde, em procedimento realizado por profissional de saúde (art. 11, II, "f"), e para cumprir obrigações legais, como a guarda do prontuário. O uso de imagens do paciente em divulgação depende do consentimento dele (art. 11, I), que pode ser registrado no próprio sistema.</p>
<h3>4. Com quem os dados são compartilhados</h3><p>Usamos o <b>Google Firebase</b> para login e banco de dados. Os servidores podem estar fora do Brasil, com as garantias contratuais do fornecedor (transferência internacional, art. 33). O site é publicado no <b>GitHub Pages</b>, que não recebe dados de pacientes. Mensagens de WhatsApp são enviadas pela própria Clínica, a partir do aparelho dela. <b>Não vendemos nem alugamos dados.</b></p>

<h3>9. Atualizações</h3><p>Esta política pode ser atualizada. A versão em vigor fica sempre disponível nesta página.</p>`}

/* ---------- Pix copia e cola (BR Code) ---------- */
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
function pixCode(valor,ref){return pixCodeFor(CFG.pix,valor,ref)}
function pixCodeFor(p,valor,ref){if(!p||!p.chave)return"";const f=(id,v)=>id+String(v.length).padStart(2,"0")+v;const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g,"").trim();
 const tx=(ref||"CLINIX").replace(/[^A-Za-z0-9]/g,"").slice(0,25)||"CLINIX";
 let s=f("00","01")+f("26",f("00","br.gov.bcb.pix")+f("01",p.chave.trim()))+f("52","0000")+f("53","986")+(valor?f("54",(+valor).toFixed(2)):"")+f("58","BR")+f("59",norm(p.nome).slice(0,25)||"CLINIX")+f("60",norm(p.cidade).slice(0,15)||"BRASIL")+f("62",f("05",tx))+"6304";return s+crc16(s)}

function barChart(months,label){const max=Math.max(...months.map(m=>m.v),1000),top=Math.ceil(max/(max>20000?10000:2000))*(max>20000?10000:2000);const W=600,H=230,pl=48,pb=28,pt=24,bw=(W-pl-20)/months.length;const y=v=>pt+(H-pt-pb)*(1-v/top);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">`;for(let g=0;g<=top;g+=top/4)s+=`<line class="grid" x1="${pl}" x2="${W-10}" y1="${y(g)}" y2="${y(g)}"/><text x="${pl-8}" y="${y(g)+4}" text-anchor="end">${g>=1000?(g/1000)+"k":g}</text>`;
 months.forEach((m,i)=>{const x=pl+i*bw+bw*.2,w=bw*.6,last=i===months.length-1;s+=`<rect class="bar ${last?"cur":""}" x="${x}" y="${y(m.v)}" width="${w}" height="${Math.max(0,y(0)-y(m.v))}" rx="8"/>${m.v?`<text class="v" x="${x+w/2}" y="${y(m.v)-7}" text-anchor="middle">${m.v>=1000?(m.v/1000).toFixed(1).replace(".",",")+"k":Math.round(m.v)}</text>`:""}<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${m.l}</text>`});return s+"</svg>"}

 <div class="cols two"><div class="card"><div class="chips" style="margin-bottom:12px">${[["todos","Todos"],["receber","A receber"],["atrasados","Atrasados"],["pagos","Pagos"]].map(c=>`<button class="chip ${finF===c[0]?"on":""}" data-finf="${c[0]}">${c[1]}</button>`).join("")}</div><div class="list">${its.slice(0,50).map(finRow).join("")||`<div class="empty">Nada por aqui.</div>`}</div></div>
  <div class="card" style="align-self:start"><h3 style="margin-bottom:12px">Como os pacientes pagam</h3><div class="stack" style="gap:10px">${Object.entries(formas).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div><div class="row" style="justify-content:space-between"><span class="small" style="font-weight:600">${k}</span><span class="small" style="font-weight:800">${Math.round(v/rec*100)}% · ${brl(v)}</span></div><div class="progress"><i style="width:${v/rec*100}%;background:var(--accent)"></i></div></div>`).join("")||`<p class="small muted">Sem recebimentos neste mês.</p>`}</div>
  ${PROFS().length>1?`<h3 style="margin:20px 0 10px">Comissões do mês</h3><div class="list">${PROFS().map(pr=>{const v=S.fin.filter(f=>f.pago&&inMes(f)&&(f.prof||PROFS()[0].id)===pr.id).reduce((s,f)=>s+f.valor,0);return `<div class="li" style="grid-template-columns:auto 1fr auto"><div class="av" style="width:36px;height:36px;border-radius:12px;background:${pr.cor}">${esc(ini(pr.nome))}</div><div class="who"><strong>${esc(pr.nome)}</strong><small>Produziu ${brl(v)} · comissão ${+pr.com||0}%</small></div><div class="end">${brl(v*(+pr.com||0)/100)}</div></div>`}).join("")}</div>`:""}</div></div>`}

function vOrc(){if(!S.pac.length)return `<div class="pagehead"><h1 class="page">Orçamento</h1></div><div class="empty">Cadastre um paciente antes de fazer orçamentos.</div>`;
 const o=ORC();const p=P(o.pid)||S.pac[0];o.pid=p.id;const tot=o.items.reduce((s,i)=>s+i.v,0),vista=tot*(1-o.desc/100);
 const ops=[[`À vista −${o.desc}%`,brl(vista),1]];[...new Set([2,3,6,10,12,o.np])].filter(n=>n>1&&n<=o.np).sort((a,b)=>a-b).forEach(n=>ops.push([`${n}x no cartão`,brl(tot/n)]));
 const linhas=o.items.map(i=>`• ${i.proc}${i.dente&&i.dente!=="—"?` (dente ${i.dente})`:""}: ${brl(i.v)}`).join("\n");
 const txt=`Olá, ${first(p.nome)}! Segue seu plano de tratamento da ${CLINICA()}:\n\n${linhas}\n\nTotal: ${brl(tot)}\nÀ vista no Pix ou dinheiro: ${brl(vista)} (${o.desc}% de desconto)\nOu em até ${o.np}x de ${brl(tot/o.np)} sem juros no cartão.\n\nQualquer dúvida, é só responder aqui. Vamos agendar o início? 😊`;
 return `<div class="pagehead"><div><h1 class="page">Orçamento</h1><p class="sub">Monte o plano, envie ao paciente e gere as parcelas no financeiro.</p></div></div>
 <div class="cols two"><div class="stack"><div class="card"><div class="fgrid">${PROFS().length>1?`<label class="f">Profissional${profSel("oProf",o.prof||PROFS()[0].id)}</label>`:""}<label class="f">Paciente<select id="oPac">${S.pac.map(x=>`<option value="${x.id}" ${x.id===p.id?"selected":""}>${esc(x.nome)}</option>`).join("")}</select></label></div>
   <div class="fgrid mt"><label class="f">Procedimento<select id="oProc">${PR().map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join("")}</select></label><label class="f">Dente (FDI)<input id="oDente" placeholder="ex.: 36"></label><label class="f">Valor (R$)<input id="oVal" type="number" min="0" step="10" value="${PR()[0][1]}"></label></div><button class="btn pri block mt" data-act="oAdd">+ Adicionar ao plano</button></div>
  <div class="card"><div class="tblwrap"><table><thead><tr><th>Procedimento</th><th>Dente</th><th class="num">Valor</th><th></th></tr></thead><tbody>${o.items.map((it,i)=>`<tr><td>${esc(it.proc)}</td><td>${it.dente&&it.dente!=="—"?`<span class="tn">${esc(it.dente)}</span>`:"—"}</td><td class="num">${brl(it.v)}</td><td class="num"><button class="xbtn" data-orm="${i}" aria-label="Remover">×</button></td></tr>`).join("")||`<tr><td colspan="4" class="muted">Adicione procedimentos acima.</td></tr>`}</tbody></table></div>
   <div class="fgrid mt"><label class="f">Desconto à vista (%)<input id="oDesc" type="number" min="0" max="30" value="${o.desc}"></label><label class="f">Parcelar em até<select id="oNp">${[1,2,3,4,5,6,8,10,12].map(n=>`<option value="${n}" ${n==o.np?"selected":""}>${n}x sem juros</option>`).join("")}</select></label></div></div></div>
 <div class="stack"><div class="card grad"><div class="small" style="opacity:.8">Total do tratamento · ${esc(p.nome)}</div><div class="big">${brl(tot)}</div><div class="pays">${ops.map(x=>`<div class="pay ${x[2]?"best":""}"><span>${x[0]}</span>${x[1]}</div>`).join("")}</div></div>
  <div class="card"><h3>Mensagem para o paciente</h3><pre class="msg" id="orcmsg">${esc(txt)}</pre><div class="row"><a class="btn wa" target="_blank" rel="noopener" href="${wa(p.fone,txt)}">${WAI}Enviar no WhatsApp</a><button class="btn" data-copy="orcmsg">Copiar</button></div></div>
  ${DONO()?`<div class="card"><h3 style="margin-bottom:6px">Paciente aprovou?</h3><p class="small muted" style="margin:0 0 10px">Gera as parcelas no financeiro, com vencimento mensal a partir de hoje.</p><div class="row"><button class="btn pri" data-approve="vista">Aprovar à vista</button><button class="btn" data-approve="parc">Aprovar em ${o.np}x</button></div></div>`:""}</div></div>`}

function vRetornos(){const its=S.ret.map(r=>{const prox=iso(addDays(parse(r.ult),r.dias));return{...r,prox,falta:diff(prox)}}).sort((a,b)=>a.falta-b.falta);
 return `<div class="pagehead"><div><h1 class="page">Retornos</h1><p class="sub">Limpeza a cada 6 meses, aparelho todo mês, revisão de implante semestral ou anual.</p></div><button class="btn pri" data-act="newRet">+ Retorno</button></div>
 <form class="card hide" id="retForm" style="margin-bottom:12px"><h3 style="margin-bottom:12px">Novo retorno</h3><div class="fgrid"><label class="f">Paciente<select id="rPac">${S.pac.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join("")}</select></label><label class="f">Tipo<input id="rTipo" value="Limpeza"></label><label class="f">Último atendimento<input id="rUlt" type="date" value="${T}"></label><label class="f">Voltar a cada<select id="rDias"><option value="30">1 mês</option><option value="90">3 meses</option><option value="180" selected>6 meses</option><option value="365">1 ano</option></select></label></div><div class="row mt"><button class="btn pri" type="submit">Salvar</button><button class="btn" type="button" data-act="closeRet">Fechar</button></div></form>
 <div class="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px">${its.map(r=>{const p=P(r.pid);if(!p)return"";const[l,c,col]=r.falta<0?[`Atrasado ${-r.falta} dias`,"t-bad","var(--bad)"]:r.falta<=15?[`Vence em ${r.falta} dias`,"t-warn","var(--warn)"]:[`Próximo: ${br(r.prox)}`,"t-ok","var(--ok)"];
  const pct=Math.min(100,Math.max(4,(r.dias-r.falta)/r.dias*100));const msg=`Olá, ${first(p.nome)}! Aqui é da ${CLINICA()}. Está na hora da sua ${r.tipo.toLowerCase()}. Vamos agendar? Temos horários esta semana. 🦷`;
  return `<div class="li" style="background:var(--surface);box-shadow:var(--shadow)"><div class="click" data-ficha="${p.id}">${avHTML(p)}</div><div class="who"><strong>${esc(p.nome)}</strong><small>${esc(r.tipo)} · última ${br(r.ult)}</small><div class="progress"><i style="width:${pct}%;background:${col}"></i></div></div><div></div>
  <div class="acts"><span class="pill dot ${c}">${l}</span>${r.falta<=15?`<a class="btn sm wa" target="_blank" rel="noopener" href="${wa(p.fone,msg)}">${WAI}Lembrar</a>`:""}<button class="btn sm" data-retok="${r.id}">Voltou hoje</button></div></div>`}).join("")||`<div class="empty">Nenhum retorno cadastrado.</div>`}</div>`}

const LST=["Enviado ao laboratório","Pronto para buscar","Instalado no paciente"];
function vLab(){return `<div class="pagehead"><div><h1 class="page">Laboratório</h1><p class="sub">Próteses, coroas e placas enviadas ao protético.</p></div><button class="btn pri" data-act="newLab">+ Novo envio</button></div>
 <form class="card hide" id="labForm" style="margin-bottom:12px"><h3 style="margin-bottom:12px">Novo envio</h3><div class="fgrid"><label class="f">Paciente<select id="lPac">${S.pac.map(p=>`<option value="${p.id}">${esc(p.nome)}</option>`).join("")}</select></label><label class="f">Trabalho<input id="lTrab" value="Coroa de porcelana"></label><label class="f">Dente<input id="lDente" placeholder="ex.: 21"></label><label class="f">Laboratório<input id="lLab" placeholder="Nome do laboratório"></label><label class="f">Prazo de entrega<input id="lPrazo" type="date" value="${iso(addDays(TODAY,10))}"></label><label class="f">Custo (R$)<input id="lVal" type="number" min="0" value="450"></label></div>
  <div class="row mt"><button class="btn pri" type="submit">Registrar envio</button><button class="btn" type="button" data-act="closeLab">Fechar</button></div></form>
 <div class="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px">${S.lab.slice().sort((a,b)=>a.st-b.st||a.prazo.localeCompare(b.prazo)).map(l=>{const p=P(l.pid);if(!p)return"";const d=diff(l.prazo);const late=l.st===0&&d<0;
  return `<div class="li" style="background:var(--surface);box-shadow:var(--shadow)"><div class="click" data-ficha="${p.id}">${avHTML(p)}</div><div class="who"><strong>${esc(l.trab)} ${l.dente?`<span class="tn">${esc(l.dente)}</span>`:""}</strong><small>${esc(p.nome)} · ${esc(l.labn)}</small></div><div class="end">${DONO()?brl(l.valor):""}</div>
  <div class="acts" style="flex-direction:column;align-items:stretch"><div class="steps">${[0,1,2].map(i=>`<i class="${i<=l.st?"on":""}"></i>`).join("")}</div><div class="row"><span class="pill dot ${late?"t-bad":l.st===2?"t-ok":l.st===1?"t-info":"t-warn"}" style="margin-right:auto">${late?`Atrasado ${-d}d`:LST[l.st]}${l.st===0&&!late?` · ${br(l.prazo)}`:""}</span>${l.st<2?`<button class="btn sm" data-labst="${l.id}">${l.st===0?"Chegou":"Instalado"}</button>`:""}</div></div></div>`}).join("")||`<div class="empty">Nenhum trabalho enviado.</div>`}</div>`}

function vMais(){const c=counts();const T3=[["contratos","Contratos",S.docs.filter(d=>!d.tipo&&!fullOk(d)).length+" pendentes","check","t-ok"],["orcamento","Orçamento","Planos de tratamento","doc","t-acc"],["retornos","Retornos",c.ret+" atrasados","clock","t-bad"],["lab","Laboratório",c.lab+" prontos","lab","t-ok"],["estoque","Estoque",c.est?c.est+" para repor":"Materiais em dia","box",c.est?"t-bad":"t-info"]];if(DONO())T3.push(["config","Configurações","Clínica, preços, equipe e plano","gear","t-info"]);
 return `<div class="pagehead"><h1 class="page">Mais</h1></div><div class="tiles">${T3.map(t=>`<button class="tile" data-go="${t[0]}"><div class="ic ${t[4]}">${ic(t[3])}</div><b>${t[1]}</b><small>${t[2]}</small></button>`).join("")}<button class="tile" data-act="logout"><div class="ic t-bad">${ic("out")}</div><b>Sair</b><small>${esc(U.email)}</small></button></div>`}

function vConfig(){if(!DONO())return vHome();const TB=[["clinica","Clínica"],["profs","Profissionais"],["precos","Preços"],["meds","Receitas"],["agonline","Agenda online"],["pagina","Página da clínica"],["contratos","Contratos"],["equipe","Equipe"],["privacidade","Privacidade"],["receb","Recebimentos"],["plano","Plano e pagamento"]];let body="";
 if(cfgTab==="clinica")body=`<div class="cols half"><div class="card"><h3 style="margin-bottom:12px">Dados da clínica</h3><div class="stack"><label class="f">Nome da clínica<input data-cf="nome" value="${esc(C.nome)}"></label><div class="fgrid"><label class="f">Responsável técnico (nome que assina)<input data-cf="dentista" value="${esc(C.dentista)}"></label><label class="f">CRO<input data-cf="cro" value="${esc(C.cro||"")}" placeholder="CRO-CE 00000"></label></div><div class="fgrid"><label class="f">WhatsApp<input data-cf="telefone" value="${esc(C.telefone)}"></label><label class="f">Cidade<input data-cf="cidade" value="${esc(C.cidade)}"></label></div></div></div>
  <div class="card"><h3 style="margin-bottom:12px">Logo e foto</h3><div class="row" style="gap:16px;align-items:flex-start"><div style="text-align:center"><label class="upav" style="display:inline-block">${C.logo?`<img src="${C.logo}" alt="Logo" style="width:88px;height:88px;border-radius:24px;object-fit:cover">`:`<div class="av lg t-acc">${ic("building")}</div>`}<span class="cam">${ic("cam")}</span><input type="file" accept="image/*" data-up="logo" hidden></label><p class="small muted">Logo</p></div>
  <div style="text-align:center"><label class="upav" style="display:inline-block">${C.foto?`<img src="${C.foto}" alt="Foto" style="width:88px;height:88px;border-radius:24px;object-fit:cover">`:`<div class="av lg t-acc">${ic("users")}</div>`}<span class="cam">${ic("cam")}</span><input type="file" accept="image/*" data-up="clinfoto" hidden></label><p class="small muted">Foto do painel</p></div></div>
  <p class="small muted">A logo aparece no menu e o nome da clínica vai em todas as mensagens enviadas aos pacientes.</p></div></div>
  <div class="card mt" id="sigcard"><div class="cardhead"><h3>Assinatura da clínica</h3>${C.assinatura&&!sigEdit?`<button class="btn sm" data-act="sigEdit">Refazer</button>`:""}</div>
  <p class="small muted" style="margin:0 0 12px">Desenhe uma vez. Ela é usada quando você toca em <b>Assinar pela clínica</b> em cada contrato, com o seu nome e o CRO.</p>
  ${C.assinatura&&!sigEdit?`<div style="background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center"><img src="${C.assinatura}" alt="Assinatura salva" style="height:90px;max-width:100%;object-fit:contain"><div class="small" style="color:#1b2a30;border-top:1.5px solid #1b2a30;max-width:300px;margin:0 auto;padding-top:6px"><b>${esc(C.dentista||C.nome)}</b>${C.cro?" · "+esc(C.cro):""}</div></div>`
   :`<canvas class="pad" id="pad" aria-label="Quadro para desenhar a assinatura da clínica"></canvas><p class="padhint">Assine com o dedo ou com o mouse</p><div class="row mt"><button class="btn pri" data-act="sigSave">Salvar assinatura</button><button class="btn" data-act="padClear">Limpar</button>${C.assinatura?`<button class="btn" data-act="sigCancel">Cancelar</button>`:""}</div>`}</div>`;
 if(cfgTab==="precos"){const L=PR();body=`<div class="card"><div class="cardhead"><h3>Procedimentos e preços</h3><button class="btn sm pri" data-act="addProc">+ Procedimento</button></div><div class="tblwrap"><table class="ptable"><thead><tr><th>Procedimento</th><th class="num">Preço (R$)</th><th></th></tr></thead><tbody>${L.map((p,i)=>`<tr><td><input data-proc="${i}" data-k="0" value="${esc(p[0])}"></td><td class="num" style="width:130px"><input type="number" min="0" step="10" data-proc="${i}" data-k="1" value="${p[1]}"></td><td class="num"><button class="xbtn" data-pdel="${i}" aria-label="Remover">×</button></td></tr>`).join("")}</tbody></table></div><p class="small muted">Esses preços aparecem na agenda, no histórico e no orçamento.</p></div>`}
 if(cfgTab==="equipe")body=`<div class="cols half"><div class="card"><h3 style="margin-bottom:12px">Quem acessa o sistema</h3><div class="list">${TEAM.map(t=>`<div class="li">${avHTML({id:t.uid,nome:t.nome})}<div class="who"><strong>${esc(t.nome)}</strong><small>${esc(t.email)} · ${t.papel==="dono"?"Responsável":"Equipe"}</small></div><div class="end">${t.papel!=="dono"?`<button class="xbtn" data-staffdel="${t.uid}" aria-label="Remover acesso">×</button>`:""}</div></div>`).join("")}</div></div>
  <form class="card" id="staffForm"><h3 style="margin-bottom:6px">Adicionar secretária ou auxiliar</h3><p class="small muted" style="margin:0 0 12px">A equipe usa agenda, pacientes, orçamento, retornos e laboratório. Não vê o financeiro nem as configurações.</p><div class="stack"><label class="f">Nome<input id="sNome" required></label><label class="f">E-mail<input id="sEmail" type="email" required></label><label class="f">Senha inicial<input id="sSenha" type="text" minlength="6" required placeholder="Mínimo 6 caracteres"></label><button class="btn pri" type="submit">Criar acesso</button></div></form></div>`;
 if(cfgTab==="profs"){const L=PROFS();body=`<div class="card" style="margin-bottom:12px"><div class="cardhead"><h3>Dentistas da clínica</h3><button class="btn sm pri" data-act="addProf">+ Profissional</button></div><p class="small muted" style="margin:0">Cada dentista tem a própria agenda, comissão e assinatura nas receitas e atestados.</p></div>
  <div class="list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px">${L.map((p,i)=>`<div class="card stack" style="gap:10px"><div class="row"><div class="av" style="width:40px;height:40px;border-radius:13px;background:${p.cor}">${esc(ini(p.nome))}</div><input data-prof="${i}" data-k="nome" value="${esc(p.nome)}" style="flex:1;font-weight:700">${L.length>1?`<button class="xbtn" data-profdel="${i}" aria-label="Remover">×</button>`:""}</div>
   <div class="fgrid"><label class="f">CRO<input data-prof="${i}" data-k="cro" value="${esc(p.cro||"")}" placeholder="CRO-CE 00000"></label><label class="f">Comissão (%)<input type="number" min="0" max="100" data-prof="${i}" data-k="com" value="${+p.com||0}"></label></div>
   <div class="row">${PCOR.map(c=>`<button class="xbtn" data-profcor="${i}" data-c="${c}" style="background:${c};outline:${p.cor===c?"3px solid var(--ink)":"none"};outline-offset:2px" aria-label="Cor"></button>`).join("")}</div>
   ${sigEdit==="prof:"+i?`<canvas class="pad" id="pad"></canvas><div class="row"><button class="btn sm pri" data-profsig="${i}">Salvar assinatura</button><button class="btn sm" data-act="padClear">Limpar</button><button class="btn sm" data-act="sigCancel">Cancelar</button></div>`
    :`<div class="row" style="justify-content:space-between">${p.ass?`<img src="${p.ass}" alt="Assinatura" style="height:48px;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--line)">`:`<span class="small muted">Sem assinatura salva</span>`}<button class="btn sm" data-profsigedit="${i}">${p.ass?"Refazer assinatura":"Desenhar assinatura"}</button></div>`}</div>`).join("")}</div>`}
 if(cfgTab==="meds"){const L=MEDS();body=`<div class="card" style="margin-bottom:12px"><div class="cardhead"><h3>Medicamentos da receita</h3><button class="btn sm pri" data-act="addMed">+ Medicamento</button></div><p class="small muted" style="margin:0">Lista que aparece para montar as receitas. Ajuste nomes, quantidades e posologias ao seu padrão. Marque os antimicrobianos para a receita sair em 2 vias.</p></div>
  <div class="stack">${L.map((m,i)=>`<div class="card"><div class="row" style="margin-bottom:8px"><input data-med="${i}" data-k="n" value="${esc(m.n)}" style="flex:2;min-width:180px;font-weight:700"><input data-med="${i}" data-k="q" value="${esc(m.q)}" style="flex:1;min-width:120px" placeholder="Quantidade"><button class="xbtn" data-meddel="${i}" aria-label="Remover">×</button></div>
   <textarea data-med="${i}" data-k="pos" style="min-height:54px">${esc(m.pos)}</textarea><div class="row mt" style="gap:14px"><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-medchk="${i}" data-k="atb" ${m.atb?"checked":""} style="width:auto">Antimicrobiano (2 vias)</label><label class="small" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-medchk="${i}" data-k="ext" ${m.uso==="externo"?"checked":""} style="width:auto">Uso externo/local</label></div></div>`).join("")}</div>`}

 const lista=low.map(x=>`- ${x.nome}: comprar ${estFmt(Math.max((+x.min||0)*2-(+x.qtd||0),1))} ${x.un||"un"}${x.forn?" ("+x.forn+")":""}`).join("\n");

 const faceCode=(n,f)=>f==="O"&&anterior(n)?"I":f==="P"&&n>30?"L":f;

 let uidc=0;
 /* vista lateral: raiz em cima e coroa embaixo; flip = coroa em cima */
 function side(n,x,y,w,flip,view,fm,whole){

 /* vista oclusal com 5 regiões clicáveis */

  S.ag.push({id:uid(),pid,data:$("agData").value,hora:$("agHora").value,proc:$("agProc").value,st:"wait",prof:$("agProf")?$("agProf").value:PROFS()[0].id});dia=$("agData").value;save();go("agenda");toast("Consulta agendada")};
  if(route.arg&&route.v==="agenda"){af.classList.remove("hide");$("agPac").value=route.arg}}
 const pf=$("pacForm");if(pf)pf.onsubmit=e=>{e.preventDefault();const p=newPac($("npNome").value.trim(),$("npFone").value.trim(),$("npNasc").value);save();fichaTab="dados";go("ficha",p.id);toast("Paciente cadastrado")};

 const ff=$("finForm");if(ff)ff.onsubmit=e=>{e.preventDefault();if(!$("fPac").value){toast("Cadastre um paciente primeiro");return}S.fin.push({id:uid(),prof:$("fProf")?$("fProf").value:PROFS()[0].id,pid:$("fPac").value,desc:$("fDesc").value,valor:+$("fVal").value||0,forma:$("fForma").value,venc:$("fVenc").value,pago:$("fPago").value==="1"});save();render();toast("Lançamento salvo")};
 const lf=$("labForm");if(lf)lf.onsubmit=e=>{e.preventDefault();if(!$("lPac").value){toast("Cadastre um paciente primeiro");return}S.lab.push({id:uid(),pid:$("lPac").value,trab:$("lTrab").value,dente:$("lDente").value,labn:$("lLab").value,envio:T,prazo:$("lPrazo").value,st:0,valor:+$("lVal").value||0});save();render();toast("Envio registrado")};
 const rf=$("retForm");if(rf)rf.onsubmit=e=>{e.preventDefault();if(!$("rPac").value){toast("Cadastre um paciente primeiro");return}S.ret.push({id:uid(),pid:$("rPac").value,tipo:$("rTipo").value,ult:$("rUlt").value,dias:+$("rDias").value});save();render();toast("Retorno salvo")};
 const sf=$("staffForm");if(sf)sf.onsubmit=async e=>{e.preventDefault();const b=sf.querySelector("button");b.disabled=true;try{await BE.addStaff(C.id,$("sNome").value.trim(),$("sEmail").value.trim().toLowerCase(),$("sSenha").value);toast("Acesso criado. Passe o e-mail e a senha para a pessoa.");sf.reset()}catch(err){toast(errMsg(err))}b.disabled=false};
 if(route.v==="orcamento"&&$("oProc")){$("oProc").onchange=e=>$("oVal").value=PR()[e.target.value][1];$("oPac").onchange=e=>{ORC().pid=e.target.value;save();render()};$("oDesc").onchange=e=>{ORC().desc=Math.min(30,Math.max(0,+e.target.value||0));save();render()};$("oNp").onchange=e=>{ORC().np=+e.target.value;save();render()};if($("oProf"))$("oProf").onchange=e=>{ORC().prof=e.target.value;save()}}
